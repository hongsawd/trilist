<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>三格 · 手机端 v1.9</title>
<style>
  :root{
    --ink:#1f2328; --ink2:#5b6470; --ink3:#8b939e;
    --line:#e3e6ea; --bg:#f6f7f9;
    --blue:#3b6ef5; --pink:#d95f8a; --green:#2f9e6e; --amber:#c8871a; --gray:#7a8494;
    --card:#fff;
    --radius:11px;
    --dur:.18s;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;min-height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei UI",sans-serif;
    color:var(--ink);
    background:var(--bg);
  }
  button,input,select{font:inherit;}
  button{transition:background var(--dur),border-color var(--dur),color var(--dur),opacity var(--dur);}
  button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #7f9cf5;outline-offset:2px;}
  .app{max-width:430px;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) 14px calc(84px + env(safe-area-inset-bottom));}

  /* 顶部日期 */
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 2px;min-width:0;}
  .topbar>div:first-child{min-width:0;}
  .date-big{font-size:21px;line-height:1.08;font-weight:700;letter-spacing:-.25px;font-variant-numeric:tabular-nums;white-space:nowrap;}
  .date-big small{font-size:12px;font-weight:600;color:var(--ink2);margin-left:5px;letter-spacing:0;}
  .date-sub{font-size:10.5px;color:var(--ink3);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .top-right{display:flex;align-items:center;gap:6px;padding-bottom:2px;flex:0 0 auto;}
  .demo{font-size:10px;color:var(--ink3);border:1px solid var(--line);border-radius:20px;padding:2px 7px;background:rgba(255,255,255,.6);}
  .icon-btn{position:relative;width:32px;height:32px;border-radius:7px;border:0;background:transparent;
    color:var(--ink3);font:inherit;font-size:15px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;}
  .icon-btn::after{content:"";position:absolute;inset:-6px;}
  .icon-btn:active{background:#eef0f3;}

  /* 通用卡片 */
  .card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:0 1px 2px rgba(20,25,35,.025);}

  /* 日历 */
  .cal-card{margin-top:12px;padding:12px 12px 8px;}
  .cal-head{display:flex;align-items:center;gap:8px;margin-bottom:4px;padding:0 2px 8px;border-bottom:1px solid var(--line);}
  .cal-month{font-size:13px;font-weight:700;letter-spacing:.1px;}
  .cal-nav{margin-left:auto;display:flex;gap:5px;}
  .cal-nav .icon-btn{width:28px;height:28px;border-radius:7px;border:1px solid var(--line);background:#fff;font-size:14px;}
  .cal-nav .icon-btn:active{background:#f1f2f4;}
  .weekdays,.days{display:grid;grid-template-columns:repeat(7,1fr);}
  .days{grid-auto-rows:48px;}
  .weekdays div{text-align:center;font-size:9.5px;color:var(--ink3);padding:7px 0 4px;}
  .day{height:48px;border:0;background:transparent;padding:1px 0 0;position:relative;display:flex;flex-direction:column;
    align-items:center;justify-content:flex-start;gap:1px;border-radius:7px;cursor:pointer;font:inherit;color:var(--ink);}
  .day .dnum{font-size:11.5px;width:21px;height:21px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-variant-numeric:tabular-nums;transition:background .15s,color .15s;}
  .day.other .dnum{color:#c4c9d3;}
  .day.today .dnum{background:var(--ink);color:#fff;font-weight:600;}
  .day:active{background:rgba(28,34,48,.05);}
  .dots{display:flex;gap:2.5px;height:4px;align-items:center;}
  .dot{width:4px;height:4px;border-radius:50%;background:var(--blue);}
  .dot.event{background:var(--pink);} .dot.habit{background:var(--green);} .dot.course{background:var(--green);}
  .cal-bars{display:flex;gap:2px;height:4px;align-items:center;justify-content:center;}
  .cal-bar{width:10px;height:3px;border-radius:2px;background:var(--blue);}
  .cal-bar.pink{background:var(--pink);} .cal-bar.green{background:var(--green);}
  .cal-bar.amber{background:var(--amber);} .cal-bar.gray{background:var(--gray);}
  .cal-wrap-grid{position:relative;overflow:hidden;}
  .cal-bars-layer{position:absolute;inset:0;display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:48px;
    pointer-events:none;min-width:0;}
  .cal-event{min-width:0;max-width:100%;height:13px;line-height:13px;padding:0 3px;margin:0 1px;border-radius:3px;font-size:8px;
    color:var(--ink2);border-left:2px solid currentColor;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    box-sizing:border-box;align-self:start;}
  .cal-event.tone-blue{background:#edf3ff;color:#3862c9;} .cal-event.tone-pink{background:#fcecf2;color:#bd527a;}
  .cal-event.tone-green{background:#e9f4ed;color:#2b8d64;} .cal-event.tone-amber{background:#fbf2df;color:#a06a13;}
  .cal-event.tone-gray{background:#f1f2f4;color:#687181;}
  .cal-more{position:absolute;right:3px;top:2px;font-size:8px;color:var(--ink3);}

  /* 两栏 */
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px;align-items:start;}
  .col{padding:10px 10px 8px;min-width:0;min-height:0;display:flex;flex-direction:column;}
  #todoList,#eventList{width:100%;max-height:min(36vh,320px);overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;padding-right:1px;}
  .col-head{display:flex;align-items:center;gap:5px;padding:0 1px 8px;margin-bottom:2px;border-bottom:1px solid var(--line);}
  .col-head .t{font-size:12.5px;font-weight:700;}
  .col-head .n{font-size:9.5px;color:var(--ink3);background:#f1f2f4;border-radius:10px;padding:1px 6px;
    font-variant-numeric:tabular-nums;}
  .col-head .more{margin-left:auto;font:inherit;font-size:10px;color:var(--ink3);border:0;background:transparent;cursor:pointer;padding:8px 0 8px 4px;margin-top:-8px;margin-bottom:-8px;}
  .bdot{width:7px;height:7px;border-radius:50%;flex:0 0 7px;}
  .bdot.todo{background:var(--amber);} .bdot.event{background:var(--blue);}

  .item{padding:7px 1px 8px;border-top:1px solid var(--line);}
  .item:first-child{border-top:0;padding-top:1px;}
  .row1{display:flex;align-items:flex-start;gap:6px;}
  .check{width:44px;height:44px;border:0;flex:0 0 44px;margin:-14px 0 -14px -14px;background:transparent;padding:0;cursor:pointer;position:relative;}
  .check::before{content:"";position:absolute;left:15px;top:15px;width:12px;height:12px;border-radius:50%;border:1.5px solid #c7ccd6;background:#fff;}
  .check.on::before{background:var(--ink);border-color:var(--ink);}
  .check.on::after{content:"";position:absolute;left:19px;top:19px;width:5px;height:3px;border-left:1.5px solid #fff;
    border-bottom:1.5px solid #fff;transform:rotate(-45deg);}
  .item.done .text{text-decoration:line-through;color:var(--ink3);}
  .item.done .meta{opacity:.55;}
  .item.past .text{text-decoration:line-through;color:var(--ink3);}
  .item.past .time{color:var(--ink3);}
  .item.past .meta,.item.past .date-label{opacity:.62;}
  .item.past .date-label{text-decoration:none;}
  .item.past .chip{background:#f1f2f4;color:var(--ink3);}
  .item.compact{padding-top:5px;padding-bottom:5px;}
  .item.compact .text{font-size:11.5px;}
  .course-dot{width:6px;height:6px;border-radius:50%;background:var(--green);flex:0 0 6px;margin:6px 5px 0 4px;}
  .item.past .course-dot{background:#b8bec7;}
  .text{font-size:12px;line-height:1.35;font-weight:500;letter-spacing:.05px;overflow-wrap:anywhere;}
  .meta{display:flex;align-items:center;gap:4px;flex-wrap:wrap;margin-top:3px;font-size:9.5px;color:var(--ink3);line-height:1.3;}
  .meta .chip{font-size:9px;padding:1.5px 5px;border-radius:4px;font-weight:600;letter-spacing:.1px;white-space:nowrap;}
  .chip.blue{background:#e9efff;color:var(--blue);}
  .chip.amber{background:#fbf0dc;color:var(--amber);}
  .chip.pink{background:#fbe8ef;color:var(--pink);}
  .chip.green{background:#e5f4ed;color:var(--green);}
  .chip.gray{background:#eef0f3;color:var(--gray);}
  .sched .time{flex:0 0 34px;font-size:10px;font-weight:700;color:var(--blue);font-variant-numeric:tabular-nums;letter-spacing:.1px;margin-top:1px;}
  .sched .text{flex:1;}
  .date-label{font-size:9px;color:var(--ink2);background:#f3f4f6;border-radius:4px;padding:1px 4px;font-weight:600;}
  .more-line{display:block;width:100%;border:0;background:transparent;font:inherit;font-size:10px;color:var(--ink3);text-align:center;padding:9px 0 4px;cursor:pointer;}
  .more-line:active{color:var(--ink);}
  .mini-sep{font-size:9px;color:var(--ink3);letter-spacing:.2px;padding:8px 1px 2px;border-top:1px dashed var(--line);margin-top:4px;}

  /* 页面切换 */
  .seg{display:flex;gap:2px;background:#eef0f3;border:1px solid var(--line);border-radius:9px;padding:2px;flex:0 1 auto;}
  .seg-btn{min-height:40px;border:0;background:transparent;font:inherit;font-size:10.5px;color:var(--ink3);padding:5px 7px;border-radius:7px;cursor:pointer;white-space:nowrap;}
  .seg-btn.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(20,25,35,.08);}

  /* 念头浮签 */
  .thought-card{margin-top:12px;padding:14px;position:relative;overflow:hidden;
    background:#fff;border:1px solid var(--line);border-top:3px solid #68a5dc;box-shadow:none;}
  .thought-card::after{display:none;}
  .thought-card.pop{animation:floatIn .45s cubic-bezier(.2,.8,.2,1);}
  @keyframes floatIn{from{opacity:0;transform:translateY(14px) scale(.985);}to{opacity:1;transform:none;}}
  .thought-head{display:flex;align-items:center;justify-content:flex-end;font-size:10px;color:var(--ink3);position:relative;z-index:1;}
  .thought-all{border:1px solid var(--line);background:#fff;font:inherit;font-size:10.5px;
    color:var(--ink2);cursor:pointer;padding:4px 8px;border-radius:8px;}
  .thought-all b{font-weight:600;}
  .thought-text{font-size:18px;line-height:1.55;font-weight:600;color:var(--ink);
    margin-top:4px;position:relative;z-index:1;min-height:54px;}
  .thought-actions{display:flex;gap:6px;margin-top:14px;position:relative;z-index:1;}
  .thought-actions button{flex:1;min-height:44px;font:inherit;font-size:11px;padding:8px 4px;border-radius:8px;border:1px solid var(--line);
    background:#fff;color:var(--ink2);cursor:pointer;}
  .thought-actions button:first-child{background:var(--ink);color:#fff;border-color:var(--ink);}

  /* 念头列表 */
  .sheet-count{font-size:10px;color:var(--ink3);font-weight:400;margin-left:4px;}
  .thought-list{max-height:52vh;overflow-y:auto;margin-top:2px;}
  .thought-row{display:flex;align-items:center;gap:8px;padding:10px 2px;border-top:1px solid var(--line);}
  .thought-row:first-child{border-top:0;}
  .thought-pick{flex:1;min-width:0;text-align:left;border:0;background:transparent;font:inherit;font-size:13px;line-height:1.4;
    color:var(--ink);cursor:pointer;padding:0;}
  .thought-row-actions{display:flex;gap:4px;flex:0 0 auto;}
  .mini{font:inherit;font-size:10.5px;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--ink2);cursor:pointer;}
  .mini.danger{color:#b45353;border-color:#efd6d6;}

  /* 课表 */
  .course-card{margin-top:10px;padding:12px 12px 10px;}
  .sec-head{display:flex;align-items:center;gap:8px;padding:0 1px 8px;border-bottom:1px solid var(--line);}
  .sec-head .t{font-size:12.5px;font-weight:700;}
  .sec-head .sub{font-size:9.5px;color:var(--ink3);}
  .week-pill{font-size:10px;color:var(--ink2);background:#f1f2f4;border-radius:7px;padding:3px 7px;font-weight:600;}
  .week-nav{display:flex;align-items:center;gap:3px;}
  .week-nav button{width:20px;height:20px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink2);
    font:inherit;font-size:12px;line-height:1;cursor:pointer;padding:0;}
  .tt-tools{display:flex;gap:6px;padding:8px 1px;flex-wrap:wrap;}
  .tt-tools button{font:inherit;font-size:10px;min-height:30px;padding:4px 8px;border:1px solid var(--line);border-radius:7px;background:#fff;
    color:var(--ink2);cursor:pointer;}
  .course-actions{display:flex;gap:8px;margin-top:14px;}
  .course-actions .submit{flex:1;margin-top:0;}
  .danger-btn{font:inherit;font-size:12px;padding:12px 14px;border-radius:12px;border:1px solid #efd6d6;background:#fff;
    color:#b45353;cursor:pointer;}
  .tt-head{display:grid;grid-template-columns:30px repeat(7,1fr);align-items:end;padding:0 0 4px;}
  .tt-day{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:9.5px;color:var(--ink3);}
  .tt-day b{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:11px;font-weight:600;color:var(--ink2);font-variant-numeric:tabular-nums;}
  .tt-day.today{color:var(--ink);font-weight:700;}
  .tt-day.today b{background:var(--ink);color:#fff;}
  .tt-grid{display:grid;grid-template-columns:30px repeat(7,1fr);grid-auto-rows:40px;position:relative;
    background-image:repeating-linear-gradient(to bottom,transparent 0 39px,rgba(28,34,48,.045) 39px 40px);}
  .tcell{grid-column:1;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;
    padding-left:1px;font-variant-numeric:tabular-nums;color:var(--ink3);}
  .tcell b{font-size:9px;color:var(--ink2);line-height:1;}
  .tcell span{font-size:7.5px;line-height:1.25;}
  .course-block{min-width:0;overflow:hidden;border-radius:6px;padding:3px;margin:2px 1px;font-size:8.5px;line-height:1.25;
    display:flex;flex-direction:column;gap:1px;color:#2f3a4a;}
  .course-block b{font-size:8.5px;font-weight:600;line-height:1.25;word-break:break-all;}
  .course-block span{font-size:7.5px;opacity:.72;line-height:1.2;word-break:break-all;}
  .course-block.short span{display:none;}
  .course-block.short b{font-size:8px;}
  .c-green{background:#e6f5e9;} .c-blue{background:#e5f0fc;} .c-pink{background:#fbe7ee;}
  .c-purple{background:#f0e8fa;} .c-yellow{background:#fdf2d6;} .c-orange{background:#fdeadd;}
  .empty{padding:18px 4px 22px;text-align:center;font-size:11px;color:var(--ink3);}

  /* 提示 */
  .toast{position:fixed;left:50%;transform:translateX(-50%) translateY(8px);bottom:calc(84px + env(safe-area-inset-bottom));
    background:rgba(28,34,48,.9);color:#fff;font-size:12px;padding:7px 14px;border-radius:20px;opacity:0;pointer-events:none;
    transition:opacity .2s,transform .2s;z-index:30;}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0);}

  /* 底部随手记 */
  .capture{position:fixed;left:0;right:0;bottom:0;
    width:100%;display:flex;align-items:center;gap:10px;padding:9px 14px calc(9px + env(safe-area-inset-bottom));
    background:rgba(255,255,255,.97);border:0;border-top:1px solid var(--line);border-radius:0;
    box-shadow:0 -3px 12px rgba(20,25,35,.035);
    font:inherit;color:var(--ink3);text-align:left;cursor:pointer;}
  .capture:active{background:#fafbfc;}
  .cap-plus{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:0 0 28px;
    background:var(--ink);color:#fff;font-size:18px;line-height:1;}
  .cap-label{flex:1;min-width:0;font-size:12.5px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .cap-arrow{flex:0 0 auto;font-size:18px;color:var(--ink3);line-height:1;}

  /* 输入面板 */
  .scrim{position:fixed;inset:0;background:rgba(18,24,38,.28);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20;}
  .scrim.on{opacity:1;pointer-events:auto;}
  .sheet{position:fixed;left:50%;transform:translate(-50%,112%);bottom:0;width:min(430px,100%);
    background:#fff;border:1px solid var(--line);border-bottom:0;border-radius:18px 18px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom));
    max-height:92vh;overflow-y:auto;
    z-index:21;transition:transform .24s cubic-bezier(.2,.8,.2,1);box-shadow:0 -8px 28px rgba(20,30,55,.12);}
  .sheet.on{transform:translate(-50%,0);}
  .grip{width:36px;height:4px;border-radius:4px;background:#e2e5eb;margin:0 auto 12px;}
  .sheet-title{font-size:13px;font-weight:700;color:var(--ink);margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--line);}
  .sync-status{font-size:11px;color:var(--ink3);margin:12px 0 4px;min-height:16px;line-height:1.5;word-break:break-all;}
  .sync-status.ok{color:#2f8f4e;}
  .sync-status.err{color:#c0392b;}
  .sync-submit{width:100%;margin-top:10px;display:flex;align-items:center;justify-content:center;gap:6px;}
  .sync-submit:active{transform:scale(.99);filter:brightness(.95);}
  .sync-submit:disabled{opacity:.75;}
  .sync-hint{font-size:10.5px;color:var(--ink3);line-height:1.7;margin:10px 2px 0;}
  .spinner{width:13px;height:13px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;
    display:inline-block;animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .sheet-input{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px;
    font:inherit;font-size:16px;outline:none;background:#fbfcfd;color:var(--ink);}
  .sheet-row{display:flex;gap:6px;align-items:center;margin-top:14px;flex-wrap:wrap;}
  .type{font:inherit;font-size:12px;min-height:36px;padding:6px 12px;border-radius:7px;border:1px solid var(--line);background:#fff;
    color:var(--ink2);cursor:pointer;}
  .type.on{background:var(--ink);border-color:var(--ink);color:#fff;}
  .event-fields{gap:8px;margin-top:10px;}
  .field{flex:1;display:flex;flex-direction:column;gap:3px;font-size:10px;color:var(--ink3);min-width:0;}
  .field input,.field select{width:100%;font:inherit;font-size:12px;min-height:36px;padding:7px 8px;border:1px solid var(--line);border-radius:7px;
    background:#fff;color:var(--ink);}
  .end-toggle{font:inherit;font-size:10px;color:var(--ink3);border:0;background:transparent;padding:2px 0 0;
    margin-top:6px;cursor:pointer;text-align:left;}
  .submit{width:100%;margin-top:14px;padding:11px;border:0;border-radius:8px;background:var(--blue);color:#fff;
    font:inherit;font-size:14px;font-weight:600;cursor:pointer;}
  .submit:active{filter:brightness(.95);}
  #page3>.card{margin-top:12px;padding:14px;}
  .hidden{display:none!important;}
  @media (max-width:360px){
    .topbar{align-items:stretch;flex-direction:column;gap:9px;}
    .seg{width:100%;}
    .seg-btn{flex:1;padding-left:4px;padding-right:4px;}
    .date-sub{white-space:normal;}
  }
  @media (orientation:landscape) and (max-height:520px){
    .app{max-width:720px;padding-top:max(10px,env(safe-area-inset-top));}
    .capture{max-width:720px;margin:0 auto;}
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;}
  }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div>
      <div class="date-big" id="pageTitle">11月2日<small>周一</small></div>
      <div class="date-sub" id="pageSub">第 10 周 · 今天 5 件事</div>
    </div>
    <div class="seg" role="tablist" aria-label="页面">
      <button class="seg-btn on" data-page="1" role="tab">今天</button>
      <button class="seg-btn" data-page="2" role="tab">念头·课表</button>
      <button class="seg-btn" data-page="3" role="tab">设置</button>
    </div>
  </header>

  <div id="page1">
  <section class="card cal-card" aria-label="日历">
    <div class="cal-head">
      <span class="cal-month" id="calMonthLabel">2026 年 11 月</span>
      <div class="cal-nav">
        <button class="icon-btn" id="prevM" aria-label="上个月">‹</button>
        <button class="icon-btn" id="nextM" aria-label="下个月">›</button>
      </div>
    </div>
    <div class="weekdays"><div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div></div>
    <div class="cal-wrap-grid">
      <div class="days" id="days"></div>
      <div class="cal-bars-layer" id="calBars"></div>
    </div>
  </section>

  <section class="cols">

<script>
(function(){
  const $ = s => document.querySelector(s);
  const STORE_KEY = "sange.mobile.v1";
  const APP_VERSION = "1.9";
  const state = { type:"thought" };
  let page = 1;
  let currentThought = null;
  let weekOffset = 0;
  let editingCourseId = null;

  function fmtDate(d){
    const y = d.getFullYear();
    const m = String(d.getMonth()+1).padStart(2,"0");
    const day = String(d.getDate()).padStart(2,"0");
    return `${y}-${m}-${day}`;
  }
  function addDays(d,n){ const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate()+n); return x; }
  const NOW = new Date();
  const TODAY = fmtDate(NOW);
  const TOMORROW = fmtDate(addDays(NOW,1));
  const WEEKDAY = "日一二三四五六"[NOW.getDay()];
  let calYear = NOW.getFullYear();
  let calMonth = NOW.getMonth();

  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }

  function parseWeeks(str){
    const set = new Set();
    const text = String(str || "").replace(/[，、；;]/g, ",").replace(/[（(]/g, "(").replace(/[）)]/g, ")");
    for (const part of text.split(",")){
      const t = part.trim();
      if (!t) continue;
      const parity = /单/.test(t) ? "odd" : (/双/.test(t) ? "even" : null);
      const range = t.match(/(\d+)\s*[-–~]\s*(\d+)/);
      const add = w => {
        if (parity === "odd" && w % 2 === 0) return;
        if (parity === "even" && w % 2 === 1) return;
        set.add(w);
      };
      if (range){
        const a = Math.min(+range[1], +range[2]), b = Math.max(+range[1], +range[2]);
        for (let w = a; w <= b; w++) add(w);
      } else {
        (t.match(/\d+/g) || []).forEach(n => add(+n));
      }
    }
    return [...set].sort((a,b) => a - b);
  }

  function periodStart(p){
    const item = PERIODS.find(v => v.no === p);
    return item ? (item.start || "—") : "—";
  }
  function periodEnd(p){
    const item = PERIODS.find(v => v.no === p);
    return item ? (item.end || item.start || "—") : "—";
  }

  const PERIODS = [
    { no:1, start:"08:30", end:"09:10" }, { no:2, start:"09:15", end:"09:55" },
    { no:3, start:"10:15", end:"10:55" }, { no:4, start:"11:00", end:"11:40" },
    { no:5, start:"11:45", end:"12:25" }, { no:6, start:"13:30", end:"14:10" },
    { no:7, start:"14:15", end:"14:55" }, { no:8, start:"15:00", end:"15:40" },
    { no:9, start:"16:00", end:"16:40" }, { no:10, start:"16:45", end:"17:25" },
    { no:11, start:"19:00", end:"19:40" }, { no:12, start:"19:40", end:"20:20" },
    { no:13, start:"", end:"" }, { no:14, start:"", end:"" }
  ];

  function allWeeks(){ return Array.from({length:18}, (_,i) => i + 1); }
  function colorFor(name){
    let h = 0;
    for (const ch of name) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
    return ["green","blue","purple","yellow","pink","orange"][h % 6];
  }
  function seedCourses(){
    const w = allWeeks();
    const base = (id, day, start, end, name, place, color) =>
      ({ id, day, start, end, name, place, teacher:"示例教师", classNo:"01", weeks:w, color });
    return [
      base("c1",1,1,2,"示例课程 A","教学楼 A 101","green"),
      base("c2",1,3,4,"示例课程 B","教学楼 B 202","blue"),
      base("c3",3,6,8,"示例课程 C","教学楼 C 303","purple"),
      base("c4",5,1,2,"示例课程 D","教学楼 A 101","green")
    ];
  }

  function now(){ return Date.now(); }

  function normalizeStore(data){
    const stamp = x => { if (!x.id) x.id = uid(); if (!x.updatedAt) x.updatedAt = now(); return x; };
    data.todos = (data.todos || []).map(stamp).map(normalizeTodoForView);
    data.events = (data.events || []).map(stamp).map(normalizeEventForView);
    data.courses = (data.courses || []).map(stamp);
    data.thoughts = (data.thoughts || []).map(t =>
      typeof t === "string" ? { id:uid(), text:t, updatedAt:now() } : stamp(t));
    if (!Array.isArray(data.deleted)) data.deleted = [];
    if (!data.sync || typeof data.sync !== "object") data.sync = { url:"", token:"", lastSync:0 };
    return data;
  }

  function seedStore(){
    const d0 = TODAY, d1 = TOMORROW;
    const d3 = fmtDate(addDays(NOW,3));
    const d6 = fmtDate(addDays(NOW,6));
    return normalizeStore({
      todos: [
        { id:"t1", text:"示例待办：写三行字", meta:"10 分钟", tag:"要办", tone:"blue", done:false },
        { id:"t2", text:"示例待办：回一条消息", meta:"今天", tag:"要办", tone:"amber", done:false },
        { id:"t3", text:"示例待办：取快递", meta:"18:00 前", tag:"要办", tone:"amber", done:false },
        { id:"t4", text:"示例待办：整理桌面", meta:"本周", tag:"信息", tone:"gray", done:false },
        { id:"t5", text:"示例待办：读十页书", meta:"明天", tag:"学业", tone:"blue", done:false }
      ],
      events: [
        { id:"e5", date:d0, time:"19:00", text:"示例例会", place:"会议室", kind:"日程", tone:"pink" },
        { id:"e8", date:d3, time:"12:00", text:"示例日程一", place:"会议室", kind:"日程", tone:"pink" },
        { id:"e9", date:d6, time:"19:00", text:"示例日程二", place:"报告厅", kind:"日程", tone:"pink" }
      ],
      courses: seedCourses(),
      thoughts: [
        "示例念头：周末去公园走走",
        "示例念头：学一门乐器",
        "示例念头：整理旧照片",
        "示例念头：试试早起"
      ]
    });
  }

  function loadStore(){
    try {
      const raw = localStorage.getItem(STORE_KEY);
      if (raw){
        const data = JSON.parse(raw);
        if (data && Array.isArray(data.todos) && Array.isArray(data.events) && Array.isArray(data.thoughts)){
          if (!Array.isArray(data.courses)) data.courses = seedCourses();
          const normalized = normalizeStore(data);
          try { localStorage.setItem(STORE_KEY, JSON.stringify(normalized)); } catch(e){}
          return normalized;
        }
      }
    } catch(e){}
    const seed = seedStore();
    try { localStorage.setItem(STORE_KEY, JSON.stringify(seed)); } catch(e){}
    return seed;
  }
  const store = loadStore();
  let storeRev = 0;
  let applyingSync = false;
  function save(){
    storeRev++;
    try { localStorage.setItem(STORE_KEY, JSON.stringify(store)); } catch(e){}
    saveWidget();
    scheduleSync();
  }

  function tombstone(kind, id){
    store.deleted = (store.deleted || []).filter(d => !(d.kind === kind && d.id === id));
    store.deleted.push({ kind, id, updatedAt: now() });
  }

  function widgetSnapshot(){
    return {
      date: TODAY,
      weekday: WEEKDAY,
      courses: coursesOn(TODAY).slice(0,4).map(c => ({ time:c.time, text:c.text, place:c.place })),
      todos: store.todos.filter(t => !t.done).slice(0,4).map(t => ({ text:t.text, meta:t.meta })),
      updated: new Date().toISOString()
    };
  }

  function saveWidget(){
    const plugins = window.Capacitor && window.Capacitor.Plugins;
    const prefs = plugins && plugins.Preferences;
    if (!prefs) return;
    prefs.set({ key:"sange.widget", value: JSON.stringify(widgetSnapshot()) })
      .then(() => {
        if (plugins.WidgetRefresh) plugins.WidgetRefresh.refresh().catch(() => {});
      })
      .catch(() => {});
  }

  // ---- 同步 ----
  const SYNC_URL = "https://YOUR-PROJECT.pages.dev/api/sync";
  const syncConfigured = () => !!(store.sync && store.sync.token);
  let syncing = false, syncTimer = null;

  function setSyncStatus(msg, cls){
    const el = $("#syncStatus");
    if (!el) return;
    el.textContent = msg;
    el.classList.toggle("ok", cls === "ok");
    el.classList.toggle("err", cls === "err");
  }

  function setSyncBusy(on){
    const btn = $("#syncNowBtn");
    if (!btn) return;
    btn.disabled = on;
    $("#syncSpin").classList.toggle("hidden", !on);
    $("#syncBtnLabel").textContent = on ? "同步中…" : "立即同步";
  }

  function renderSyncPage(){
    $("#syncToken").value = (store.sync && store.sync.token) || "";
    const has = store.sync && store.sync.lastSync;
    setSyncStatus(
      has ? "上次同步：" + new Date(store.sync.lastSync).toLocaleString("zh-CN") : "还没有同步过",
      has ? "ok" : ""
    );
  }

  function scheduleSync(){
    if (applyingSync || !syncConfigured()) return;
    clearTimeout(syncTimer);
    syncTimer = setTimeout(() => syncNow(true), 4000);
  }

  function collectItems(){
    const out = [];
    const put = (kind, arr) => arr.forEach(x => out.push({
      kind, id:x.id, updatedAt:x.updatedAt || 0, deleted:false, payload:x
    }));
    put("todo", store.todos);
    put("event", store.events);
    put("course", store.courses);
    put("thought", store.thoughts);
    (store.deleted || []).forEach(d => out.push({
      kind:d.kind, id:d.id, updatedAt:d.updatedAt, deleted:true, payload:null
    }));
    return out;
  }

  function normalizeTodoForView(x){
    const out = { ...x };
    const catMap = {
      urgent:{tag:"紧急", tone:"pink"},
      action:{tag:"要办", tone:"amber"},
      academic:{tag:"学业", tone:"blue"},
      info:{tag:"信息", tone:"gray"}
    };
    const mapped = catMap[out.cat] || {tag:"", tone:"gray"};
    if (!out.tag) out.tag = mapped.tag;
    if (!out.tone) out.tone = mapped.tone;
    if (!out.meta){
      const when = [out.date ? out.date.slice(5) : "", out.time || ""].filter(Boolean).join(" ");
      out.meta = [when, out.note || ""].filter(Boolean).join(" · ");
    }
    out.done = !!out.done;
    return out;
  }

  function normalizeEventForView(x){
    const out = { ...x };
    const catMap = {
      urgent:{kind:"紧急", tone:"pink"},
      action:{kind:"要办", tone:"amber"},
      academic:{kind:"学业", tone:"blue"},
      info:{kind:"日程", tone:"gray"}
    };
    const mapped = catMap[out.cat] || {kind:"日程", tone:"pink"};
    if (!out.place) out.place = out.where || "";
    if (!out.kind) out.kind = mapped.kind;
    if (!out.tone) out.tone = mapped.tone;
    return out;
  }

  function applySnapshot(items){
    const buckets = { todo:[], event:[], course:[], thought:[] };
    (items || []).forEach(it => {
      if (!it || it.deleted || !buckets[it.kind]) return;
      buckets[it.kind].push({ ...(it.payload || {}), id:it.id, updatedAt:it.updatedAt });
    });
    store.todos = buckets.todo.map(normalizeTodoForView);
    store.events = buckets.event.map(normalizeEventForView);
    store.courses = buckets.course;
    store.thoughts = buckets.thought.map(x => ({...x, text:x.text || ""}));
    store.deleted = [];
    currentThought = null;
  }

  function renderAll(){
    renderCalendar();
    renderTodos();
    renderEvents();
    renderTimetable();
    if (page === 2) pickThought();
    saveWidget();
  }

  async function syncNow(silent){
    const tokenInput = $("#syncToken");
    if (tokenInput){
      const t = tokenInput.value.trim();
      if (t && store.sync.token !== t){
        store.sync.token = t;
        applyingSync = true; save(); applyingSync = false;
      }
    }
    store.sync.url = SYNC_URL;
    if (!syncConfigured()){
      setSyncStatus("先填令牌", "err");
      if (!silent) showToast("先填令牌");
      return;
    }
    if (syncing){
      setSyncStatus("正在同步，请稍候…");
      return;
    }
    syncing = true;
    setSyncBusy(true);
    setSyncStatus("同步中…");
    const rev = storeRev;
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 12000);
    try {
      const url = SYNC_URL;
      const res = await fetch(url, {
        method:"POST",
        headers:{ "content-type":"application/json", "authorization":"Bearer " + store.sync.token },
        body: JSON.stringify({ items: collectItems() }),
        signal: ctrl.signal
      });
      const data = await res.json().catch(() => ({}));
      if (res.status === 401) throw new Error("令牌不对，检查是否复制完整");
      if (!res.ok) throw new Error(data.error || ("HTTP " + res.status));
      if (rev === storeRev){
        applyingSync = true;
        applySnapshot(data.items || []);
        store.sync.lastSync = now();
        save();
        applyingSync = false;
        renderAll();
      }
      setSyncStatus("已同步 · " + new Date(store.sync.lastSync || Date.now()).toLocaleString("zh-CN"), "ok");
      if (!silent) showToast("同步完成");
    } catch(e){
      applyingSync = false;
      const raw = String((e && e.message) || e);
      const msg = (e && e.name === "AbortError")
        ? "连接超时，手机网络到不了同步服务"
        : /Failed to fetch|NetworkError|Load failed|Network request failed/i.test(raw)
          ? "网络不通，检查代理或换个网络"
          : raw;
      setSyncStatus("同步失败：" + msg, "err");
      if (!silent) showToast("同步失败：" + msg);
    } finally {
      clearTimeout(timer);
      syncing = false;
      setSyncBusy(false);
    }
  }

  function esc(s){ return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

  function coursesOn(dateStr){
    const d = new Date(dateStr + "T00:00:00");
    const w = weekNoForDate(d);
    const day = (d.getDay() + 6) % 7 + 1;
    return store.courses
      .filter(c => c.day === day && (c.weeks || []).includes(w))
      .map(c => ({ date:dateStr, time:periodStart(c.start), endTime:periodEnd(c.end), text:c.name, place:c.place,
                   kind:"课程", tone:c.color, courseId:c.id }));
  }

  function eventEndMoment(e){
    const endDate = e.endDate || e.date;
    const t = e.endTime || "";
    if (t) return new Date(endDate + "T" + t + ":00");
    if (!e.endDate && e.time){
      const d = new Date(e.date + "T" + e.time + ":00");
      d.setMinutes(d.getMinutes() + 50);
      return d;
    }
    return new Date(endDate + "T23:59:59");
  }
  function eventPast(e){ return eventEndMoment(e) < new Date(); }

  function upcomingEvents(){
    const now = new Date();
    const base = store.events.filter(e =>
      !e.done && eventEndMoment(e) >= now && (e.endDate || e.date) >= TODAY);
    const courses = coursesOn(TODAY).map(c => ({...c, past:coursePast(c)}));
    return base.concat(courses)
      .sort((a,b) => Number(!!a.past) - Number(!!b.past) || (a.date+a.time).localeCompare(b.date+b.time));
  }

  function coursePast(c){
    const end = new Date(c.date + "T" + (c.endTime === "—" ? c.time : c.endTime) + ":00");
    if (Number.isNaN(end.getTime())){
      const fallback = new Date(c.date + "T" + c.time + ":00");
      if (Number.isNaN(fallback.getTime())) return false;
      fallback.setMinutes(fallback.getMinutes() + 50);
      return fallback < new Date();
    }
    return end < new Date();
  }

  function dayLabel(dateStr){
    if (dateStr === TODAY) return "今天";
    if (dateStr === TOMORROW) return "明天";
    const parts = dateStr.split("-");
    return `${Number(parts[1])}/${Number(parts[2])}`;
  }

  function eventDateLabel(e){
    const end = e.endDate || e.date;
    if (end === e.date) return dayLabel(e.date);
    return `${dayLabel(e.date)}–${dayLabel(end)}`;
  }

  function eventsOnDate(dateStr){
    return store.events.filter(e => e.date <= dateStr && dateStr <= (e.endDate || e.date));
  }

  function updatePageSub(){
    if (page !== 1) return;
    const active = store.todos.filter(t => !t.done).length;

  function renderCalendar(){
    const first = new Date(calYear, calMonth, 1);
    const start = new Date(calYear, calMonth, 1 - first.getDay());
    const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
    const rows = Math.ceil((first.getDay() + daysInMonth) / 7);
    const gridStart = new Date(start.getFullYear(), start.getMonth(), start.getDate());
    const gridEnd = addDays(gridStart, rows * 7 - 1);
    const overflow = {};
    const placed = Array.from({length: rows}, () => []);
    const weekBars = Array.from({length: rows}, () => []);

    store.events.forEach(e => {
      const rawEnd = e.endDate && e.endDate >= e.date ? e.endDate : e.date;
      const evStart = new Date(e.date + "T00:00:00");
      const evEnd = new Date(rawEnd + "T00:00:00");
      const segStart = evStart > gridStart ? evStart : gridStart;
      const segEnd = evEnd < gridEnd ? evEnd : gridEnd;
      if (segStart > segEnd) return;
      let cursor = new Date(segStart.getFullYear(), segStart.getMonth(), segStart.getDate());
      while (cursor <= segEnd){
        const weekRow = Math.floor((cursor - gridStart) / (7 * 86400000));
        const weekStart = addDays(gridStart, weekRow * 7);
        const weekEnd = addDays(weekStart, 6);
        const s = cursor > weekStart ? cursor : weekStart;
        const en = segEnd < weekEnd ? segEnd : weekEnd;
        weekBars[weekRow].push({
          startCol: s.getDay(),
          endCol: en.getDay(),
          start: new Date(s.getFullYear(), s.getMonth(), s.getDate()),
          end: new Date(en.getFullYear(), en.getMonth(), en.getDate()),
          text: e.text,
          tone: e.tone || "blue"
        });
        cursor = addDays(en, 1);
      }
    });

    weekBars.forEach((segments, weekRow) => {
      const occupied = [[], []];
      segments.sort((a,b) => (a.startCol - b.startCol) || (a.endCol - b.endCol));
      segments.forEach(seg => {
        let row = 0;
        while (row < 2 && occupied[row].some(o => !(seg.endCol < o.startCol || seg.startCol > o.endCol))) row++;
        if (row >= 2){
          for (let d = new Date(seg.start); d <= seg.end; d = addDays(d, 1)){
            const ds = fmtDate(d);
            overflow[ds] = (overflow[ds] || 0) + 1;
          }
          return;
        }
        occupied[row].push(seg);
        placed[weekRow].push({...seg, row});
      });
    });

    let cells = "";
    for (let i = 0; i < rows * 7; i++){
      const d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i);
      const dateStr = fmtDate(d);
      const other = d.getMonth() !== calMonth;
      const isToday = dateStr === TODAY;
      const cls = ["day", other ? "other" : "", isToday ? "today sel" : ""].filter(Boolean).join(" ");
      const more = overflow[dateStr] || 0;
      cells += `<button class="${cls}" data-date="${dateStr}" ${other ? 'tabindex="-1"' : ""}><span class="dnum">${d.getDate()}</span>${more ? `<span class="cal-more">+${more}</span>` : ""}</button>`;
    }

    let bars = "";
    placed.forEach((segments, weekRow) => {
      segments.forEach(seg => {
        bars += `<div class="cal-event tone-${seg.tone}" style="grid-column:${seg.startCol+1} / ${seg.endCol+2};grid-row:${weekRow+1};margin-top:${25 + seg.row*12}px;">${esc(seg.text)}</div>`;
      });
    });

    $("#days").innerHTML = cells;
    $("#calBars").innerHTML = bars;
    $("#calMonthLabel").textContent = `${calYear} 年 ${calMonth + 1} 月`;
    $("#days").querySelectorAll(".day[data-date]").forEach(btn => {
      btn.onclick = () => openDaySheet(btn.dataset.date);
    });
  }

  function mondayOf(date){
    const d = new Date(date.getFullYear(), date.getMonth(), date.getDate());
    const offset = (d.getDay() + 6) % 7;
    d.setDate(d.getDate() - offset);
    return d;
  }
  const WEEK9_MONDAY = new Date(2026, 9, 26);
  const DAY_NAMES = ["一","二","三","四","五","六","日"];

  function weekNoForDate(d){
    const monday = mondayOf(d);
    return 9 + Math.round((monday - WEEK9_MONDAY) / (7 * 86400000));
  }
  function currentWeekNo(){ return weekNoForDate(new Date()); }

  function renderTimetable(){
    const monday = addDays(mondayOf(NOW), weekOffset * 7);
    const sunday = addDays(monday, 6);
    const weekNo = currentWeekNo() + weekOffset;
    const todayDay = (NOW.getDay() + 6) % 7 + 1;
    const showToday = weekOffset === 0;
    const week = DAY_NAMES.map((label, i) => ({ label, date: addDays(monday, i).getDate(), day: i + 1 }));

    $("#weekPill").textContent = `第 ${weekNo} 周`;
    $("#weekRange").textContent = `${monday.getMonth()+1}/${monday.getDate()}–${sunday.getMonth()+1}/${sunday.getDate()}`;
    $("#ttHead").innerHTML = `<div></div>` + week.map(d => `
      <div class="tt-day ${showToday && d.day === todayDay ? "today" : ""}">
        <span>${d.label}</span><b>${d.date}</b>
      </div>`).join("");

    let html = showToday ? `<div style="grid-column:${todayDay+1};grid-row:1 / span ${PERIODS.length};background:rgba(59,110,245,.035);pointer-events:none;"></div>` : "";
    PERIODS.forEach(p => {
      html += `<div class="tcell" style="grid-row:${p.no}"><b>${p.no}</b><span>${p.start}</span><span>${p.end}</span></div>`;
    });
    store.courses.filter(c => (c.weeks || []).includes(weekNo)).forEach(c => {
      const span = Math.max(1, (c.end || c.start) - c.start + 1);
      const showPlace = span >= 3;
      html += `<div class="course-block c-${c.color}${span === 1 ? " short" : ""}" data-course-id="${c.id}" style="grid-column:${c.day+1};grid-row:${c.start} / span ${span}">
        <b>${esc(c.name)}</b>${showPlace ? `<span>@${esc(c.place)}</span>` : ""}
      </div>`;
    });
    $("#ttGrid").innerHTML = html;
    $("#ttGrid").querySelectorAll(".course-block").forEach(el => {
      el.onclick = () => { if (ttSwiped) return; openCourseEditor(el.dataset.courseId); };

  function formatWeeks(weeks){
    const arr = [...new Set(weeks)].sort((a,b) => a - b);
    const parts = [];
    let start = null, prev = null;
    for (const w of arr){
      if (start === null){ start = prev = w; continue; }
      if (w === prev + 1){ prev = w; continue; }
      parts.push(start === prev ? String(start) : `${start}-${prev}`);
      start = prev = w;
    }
    if (start !== null) parts.push(start === prev ? String(start) : `${start}-${prev}`);
    return parts.join(",");
  }

  function parseTimetableHtml(html){
    const doc = new DOMParser().parseFromString(html, "text/html");
    const tables = Array.from(doc.querySelectorAll("table"));
    const table = tables.find(t => /星期/.test(t.textContent || "")) || tables[0];
    if (!table) return [];
    const out = [];
    const seen = new Set();

    table.querySelectorAll("td").forEach(td => {
      let text = (td.textContent || "").replace(/ /g, " ").replace(/\s+/g, " ").trim();
      text = text.replace(/星期天|星期日/g, "星期7");
      if (!text || !/周/.test(text) || !/星期[1-7]/.test(text)) return;

      let m = text.match(/^(.*?)\[(\d+)\]\s*(.*?)\s*([0-9,，、;；\-–~周单双()（）]+周)\s*,\s*星期([1-7])\s*,\s*(\d+)\s*-\s*(\d+)\s*节\s*,\s*(.+)$/);
      let name, classNo = "", teacher = "", weeksText, day, start, end, place;
      if (m){
        [, name, classNo, teacher, weeksText, day, start, end, place] = m;
      } else {
        m = text.match(/^(.*?)\s+([0-9,，、;；\-–~周单双()（）]+周)\s*,\s*星期([1-7])\s*,\s*(\d+)\s*-\s*(\d+)\s*节\s*,\s*(.+)$/);
        if (!m) return;
        [, name, weeksText, day, start, end, place] = m;
      }
      name = name.trim();
      teacher = teacher.trim();
      place = place.trim();
      const weeks = parseWeeks(weeksText);
      if (!name || !weeks.length) return;
      const key = [name, day, start, end, weeks.join(","), place, teacher].join("|");
      if (seen.has(key)) return;
      seen.add(key);
      out.push({ id:uid(), name, classNo, teacher, day:+day, start:+start, end:+end, weeks, place, color:colorFor(name), updatedAt:now() });
    });
    return out;
  }

    closeDaySheet();
  }

  function showToast(msg){
    const t = $("#toast");
    t.textContent = msg;
    t.classList.add("on");
    clearTimeout(showToast.timer);
    showToast.timer = setTimeout(() => t.classList.remove("on"), 1800);
  }

  function setPage(n){
    page = n;
    $("#page1").hidden = n !== 1;
    $("#page2").hidden = n !== 2;
    $("#page3").hidden = n !== 3;
    document.querySelectorAll(".seg-btn").forEach(b => {
      const selected = +b.dataset.page === n;
      b.classList.toggle("on", selected);
      b.setAttribute("aria-selected", String(selected));
    });
    if (n === 1){
      const d = new Date();
      $("#pageTitle").innerHTML = `${d.getMonth()+1}月${d.getDate()}日<small>周${"日一二三四五六"[d.getDay()]}</small>`;
      updatePageSub();
    } else if (n === 2){
      $("#pageTitle").innerHTML = '念头<small>与课表</small>';
      $("#pageSub").textContent = `每次打开，随机浮上来一张 · v${APP_VERSION}`;
      pickThought();
    } else {
      $("#pageTitle").innerHTML = '设置<small>同步</small>';
      $("#pageSub").textContent = `v${APP_VERSION}`;
      renderSyncPage();
    }
    closeSheet();
    closeThoughtList();
    closeAllSheets();
    closeCourseSheet();
    window.scrollTo({ top:0, behavior:"smooth" });
  }

  function openSheet(type){
    closeThoughtList();
    closeAllSheets();
    closeCourseSheet();
    $("#eventDate").value = TODAY;
    if (!$("#eventTime").value) $("#eventTime").value = "09:00";
    $("#eventEndDate").value = "";
    $("#eventEndTime").value = "";
    $("#eventEndFields").classList.add("hidden");
    $("#endToggle").classList.add("hidden");
    $("#endToggle").textContent = "▲ 结束";
    setType(type || "thought");
    $("#sheet").classList.add("on");
    $("#scrim").classList.add("on");
    setTimeout(() => $("#sheetInput").focus(), 180);
  }
  function closeSheet(){
    $("#sheet").classList.remove("on");
    $("#scrim").classList.remove("on");
    $("#sheetInput").blur();
  }

  $("#capture").onclick = () => openSheet("thought");
  $("#scrim").onclick = closeSheet;
  $("#allThoughts").onclick = openThoughtList;
  $("#listScrim").onclick = closeThoughtList;
  $("#prevM").onclick = () => { calMonth--; if (calMonth < 0){ calMonth = 11; calYear--; } renderCalendar(); };
  $("#nextM").onclick = () => { calMonth++; if (calMonth > 11){ calMonth = 0; calYear++; } renderCalendar(); };
  $("#allTodos").onclick = openTodosSheet;
  $("#allEvents").onclick = openEventsSheet;
  $("#allScrim").onclick = closeAllSheets;
  $("#dayScrim").onclick = closeDaySheet;
  $("#thisWeek").onclick = () => { weekOffset = 0; renderTimetable(); };

  let ttSwipe = null, ttSwiped = false;
  $("#ttGrid").addEventListener("pointerdown", e => {
    ttSwipe = { x:e.clientX, y:e.clientY };
    ttSwiped = false;
  }, { passive:true });
  $("#ttGrid").addEventListener("pointerup", e => {
    if (!ttSwipe) return;
    const dx = e.clientX - ttSwipe.x, dy = e.clientY - ttSwipe.y;
    ttSwipe = null;
    if (Math.abs(dx) < 50 || Math.abs(dx) < Math.abs(dy) * 1.5) return;
    ttSwiped = true;
    weekOffset += dx < 0 ? 1 : -1;
    renderTimetable();
    setTimeout(() => { ttSwiped = false; }, 350);
  }, { passive:true });
  $("#ttGrid").addEventListener("pointercancel", () => { ttSwipe = null; }, { passive:true });
  $("#addCourseBtn").onclick = () => openCourseEditor(null);
  $("#importBtn").onclick = () => $("#importFile").click();
  $("#importFile").onchange = e => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => importTimetableHtml(String(reader.result || ""));
    reader.readAsText(file, "utf-8");
    e.target.value = "";
  };
  $("#courseSave").onclick = saveCourse;
  $("#courseDelete").onclick = deleteCourse;
  $("#courseScrim").onclick = closeCourseSheet;
  $("#syncNowBtn").onclick = () => syncNow(false);
  $("#endToggle").onclick = () => {
    const opening = $("#eventEndFields").classList.contains("hidden");
    $("#eventEndFields").classList.toggle("hidden", !opening);
    $("#endToggle").textContent = opening ? "▼ 收起" : "▲ 结束";
    if (opening && !$("#eventEndDate").value) $("#eventEndDate").value = $("#eventDate").value || TODAY;
  };

  document.querySelectorAll(".seg-btn").forEach(b => { b.onclick = () => setPage(+b.dataset.page); });

  document.querySelectorAll("[data-act]").forEach(btn => {
    btn.onclick = () => {
      if (!currentThought) return;
      const act = btn.dataset.act;
      if (act === "to"){
        store.todos.unshift({ id:uid(), text:currentThought.text, meta:"今天", tag:"要办", tone:"amber", done:false, updatedAt:now() });
        save();
        renderTodos();
        showToast("已放进待办");
        dropThought();
      } else if (act === "drop"){
        showToast("已搁下");
        dropThought();
      } else if (act === "next"){
        pickThought();
      }
    };
  });

  function setType(type){
    state.type = type;
    document.querySelectorAll(".type").forEach(b => b.classList.toggle("on", b.dataset.type === type));
    $("#eventFields").classList.toggle("hidden", type !== "event");
    $("#endToggle").classList.toggle("hidden", type !== "event");
    if (type !== "event"){
      $("#eventEndFields").classList.add("hidden");
      $("#endToggle").textContent = "▲ 结束";
    }
  }
  document.querySelectorAll(".type").forEach(btn => {
    btn.onclick = () => setType(btn.dataset.type);
  });

  $("#submitBtn").onclick = () => {
    const text = $("#sheetInput").value.trim();
    if (!text) { $("#sheetInput").focus(); return; }
    if (state.type === "thought"){
      store.thoughts.unshift({ id:uid(), text, updatedAt:now() });
      save();
      if (page === 2) pickThought();
      showToast("已放进念头");
    } else if (state.type === "todo"){
      store.todos.unshift({ id:uid(), text, meta:"今天", tag:"要办", tone:"amber", done:false, updatedAt:now() });
      save();
      renderTodos();
      showToast("已放进待办");
    } else {
      let date = $("#eventDate").value || TODAY;
      const time = $("#eventTime").value || "09:00";
      let endDate = $("#eventEndDate").value || "";
      const endTime = $("#eventEndTime").value || "";
      if (endDate && endDate < date) endDate = date;
      store.events.push({ id:uid(), date, time, endDate, endTime, text, place:"", kind:"日程", tone:"pink", updatedAt:now() });
      save();
      renderEvents();
      renderCalendar();
      showToast("已放进日程");
    }
    $("#sheetInput").value = "";
    state.type = "thought";
    document.querySelectorAll(".type").forEach(b => b.classList.toggle("on", b.dataset.type === "thought"));
    $("#eventFields").classList.add("hidden");
    $("#endToggle").classList.add("hidden");
    $("#eventEndFields").classList.add("hidden");
    $("#endToggle").textContent = "▲ 结束";
    $("#eventEndDate").value = "";
    $("#eventEndTime").value = "";
    closeSheet();
  };

  $("#sheetInput").addEventListener("keydown", e => {
    if (e.key === "Enter") { e.preventDefault(); $("#submitBtn").click(); }
  });

  let swipeStart = null;
  document.addEventListener("pointerdown", e => {
    if (e.target.closest("button,input,textarea,select,a,.sheet,.scrim")) return;
    swipeStart = { x:e.clientX, y:e.clientY, id:e.pointerId };
  }, { passive:true });
  document.addEventListener("pointerup", e => {
    if (!swipeStart || swipeStart.id !== e.pointerId) return;
    const dx = e.clientX - swipeStart.x;
    const dy = e.clientY - swipeStart.y;
    swipeStart = null;
    if (Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy) * 1.25) return;
    if (dx < 0 && page === 1) setPage(2);
    else if (dx > 0 && page === 2) setPage(1);
  }, { passive:true });
  document.addEventListener("pointercancel", () => { swipeStart = null; }, { passive:true });

  fillCourseSelects();
  renderCalendar();
  renderTodos();
  renderEvents();
  renderTimetable();
  setPage(1);
  saveWidget();
  setInterval(() => { renderEvents(); updatePageSub(); }, 60000);
  if (syncConfigured()) setTimeout(() => syncNow(true), 800);
})();
</script>
</body>
</html>
